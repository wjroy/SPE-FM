context_length: 8
experiments:
  split_comparison:
    splits: [60/10/30, 40/10/50, 20/10/70]
    horizons: [1]
    families: [statistical, neural]
  horizon_comparison:
    splits: [40/10/50]
    horizons: [3, 5, 8]
    families: [statistical, neural]
    models: [Persistence, Moving average, ARIMA, PatchTST]
selection:
  subset: validation
  test_usage: selected_configuration_only
  statistical_metric: pooled_rmse_mm
  tie_break: candidate_order
statistical_fit:
  maxiter: 50
  nonconvergence: record
  fit_error: raise
implementation:
  temporal_node_handling: shared_nodewise
  normalization: training_node_mean_std
  transformer_activation: gelu
  transformer_norm_first: true
  informer_formulation: official_informer_encoder_decoder
  patchtst_formulation: official_supervised_backbone
  patchtst_pooling: flatten
  a3tgcn_formulation: pytorch_geometric_temporal_A3TGCN2
  graph_symmetrization: maximum
  graph_self_loops: true
  graph_normalization: symmetric_degree_in_gcn
neural_training:
  optimizer: AdamW
  loss: MSE
  augmentation: none
  clip_norm: 1.0
  evaluation_batch_size: 32
  evaluation_seed: 42
  scheduler:
    factor: 0.5
    patience: 8
    min_lr: 1.0e-06
models:
  Persistence:
    family: statistical
    grid: {}
    fixed:
      node_wise: true
      input_length: 8
  Moving average:
    family: statistical
    grid:
      window: [2, 3, 4, 5, 7, 8]
    fixed:
      node_wise: true
      input_length: 8
  ARIMA:
    family: statistical
    grid:
      order:
      - [0, 1, 0]
      - [1, 1, 0]
      - [0, 1, 1]
      - [1, 1, 1]
      - [2, 1, 0]
      - [0, 1, 2]
    fixed:
      node_wise: true
      input_length: 8
      trend: n
      enforce_stationarity: true
      enforce_invertibility: true
  Att-BiLSTM:
    family: neural
    random_space:
      learning_rate: [0.0005, 0.001, 0.002, 0.003, 0.005]
      batch_size: [8, 16, 32, 64]
      weight_decay: [0.0, 1.0e-05, 0.0001]
      hidden_size: [16, 32, 64, 128]
      dropout: [0.0, 0.05, 0.1, 0.2]
      layers: [1, 2, 3]
      initialization: [default, forget_bias_one]
    fixed:
      attention: additive_temporal
    candidates:
      60/10/30:
      - {learning_rate: 0.005, batch_size: 16, layers: 1, dropout: 0.0, hidden_size: 32, weight_decay: 0.0001, initialization: default}
      - {learning_rate: 0.002, batch_size: 32, layers: 1, dropout: 0.0, hidden_size: 16, weight_decay: 0.0, initialization: default}
      - {learning_rate: 0.003, batch_size: 32, layers: 2, dropout: 0.2, hidden_size: 16, weight_decay: 0.0, initialization: default}
      - {learning_rate: 0.003, batch_size: 64, layers: 1, dropout: 0.0, hidden_size: 16, weight_decay: 1.0e-05, initialization: forget_bias_one}
      - {learning_rate: 0.0005, batch_size: 64, layers: 2, dropout: 0.05, hidden_size: 16, weight_decay: 0.0, initialization: default}
      - {learning_rate: 0.0005, batch_size: 8, layers: 1, dropout: 0.0, hidden_size: 64, weight_decay: 0.0, initialization: forget_bias_one}
